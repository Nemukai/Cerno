<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply theme before paint to avoid a flash. Explicit preference wins;
      // otherwise the landing ("/") defaults dark and the app defaults light.
      (function () {
        try {
          var t = localStorage.getItem("cerno-theme");
          var def = location.pathname === "/" ? "dark" : "light";
          var theme = t === "dark" || t === "light" ? t : def;
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerno — Data Intelligence System</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Cerno is a link-aware data intelligence system for investigative analysis — discover hidden relationships, surface anomalies, and interrogate any dataset under controlled access."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,300,400&display=swap" rel="stylesheet" />
    <script defer src="https://analytics.priyanshnik.com/script.js" data-website-id="f6685dc3-0aec-489d-8410-16f2483c9a37"></script>
  </head>
  <body class="bg-tidepaper text-night-watch antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
